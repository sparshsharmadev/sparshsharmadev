  <rect y="534" width="1200" height="66" fill="#0A0F3D"/>
  <text x="48" y="576" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#FFE066">Software developer. Co-lead at bits&amp;bytes Bengaluru. Curious about what's beneath the interface.</text>
