<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Sparsh Sharma. Software developer, founder of Manshverse.</title>
  <rect width="1200" height="600" fill="#2733FF"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic">
    <text x="48" y="58" font-size="22" fill="#FBFAF5">The Sparsh Sharma issue</text>
    <text x="1152" y="58" font-size="22" fill="#FBFAF5" text-anchor="end">Bengaluru, 2026</text>

    <text x="30" y="285" font-size="250" font-weight="700" fill="#FFE066" textLength="900" lengthAdjust="spacingAndGlyphs">Sparsh</text>
    <text x="30" y="505" font-size="250" font-weight="700" fill="none" stroke="#FBFAF5" stroke-width="3" stroke-linejoin="round" textLength="900" lengthAdjust="spacingAndGlyphs">Sharma</text>
  </g>

  <g transform="translate(1078 150) rotate(-12)">
